# Keep react-navigation on the versions released alongside react-native-screens 4.16
# (Expo SDK 54). Newer native-stack (7.4+) expects newer screens; on iOS the stack
# stopped opening screens after the first back navigation.
overrides:
  '@react-navigation/native-stack': 7.3.28
  '@react-navigation/bottom-tabs': 7.4.9
  '@react-navigation/elements': 2.6.5
  '@react-navigation/native': 7.1.18
  '@react-navigation/core': 7.12.4
