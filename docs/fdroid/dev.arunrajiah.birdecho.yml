MaintainerNotes: |-
  Expo SDK 54 / React Native 0.81 app. The android/ directory is NOT committed —
  it is generated at build time by `npx expo prebuild --platform android --clean`.
  The subdir points to android/app (created by prebuild).

  Node 24 + pnpm 10 required. Node is manually downloaded in sudo: because Debian's
  packaged Node is too old. Update the tarball URL and SHA-256 hash whenever the
  Node 24 LTS patch version bumps (check https://nodejs.org/en/download/).

  Active Expo config changed from app.json to app.config.ts at v0.3.3. Both files
  exist from v0.3.3 onward; the prebuild: step strips projectId from both to be safe.

  Sentry (@sentry/react-native) is present but is a no-op unless EXPO_PUBLIC_SENTRY_DSN
  is set at build time (it is NOT set in this recipe). Sentry is self-hostable (AGPL).
  Its native Android layer is compiled regardless of the env var, hence the Tracking
  declaration. To produce a Sentry-free build, uncomment the sed line in init:.

  react-native-maps (added in v0.5.0) requires a Google Maps API key for tile rendering
  on Android. The key is NOT set in this recipe (EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is
  absent). Map tiles will be blank but station markers and all interactions still work.
  This is documented in the app's README.

  The app sets android:usesCleartextTraffic="true" (via expo-build-properties) to allow
  HTTP connections to local BirdNET-Pi/Go stations on the user's LAN. This is
  intentional and documented.

  The GitHub build includes an in-app updater (expo-application + expo-intent-launcher)
  that downloads the latest APK from GitHub Releases and launches Android's package
  installer. F-Droid provides its own update channel, so this build sets
  EXPO_PUBLIC_FDROID=1 before `expo prebuild` (see the prebuild step below). That flag
  disables the in-app updater AND drops the REQUEST_INSTALL_PACKAGES permission, so the
  F-Droid APK contains neither the self-updater nor that permission. Verify with
  `aapt dump permissions` that REQUEST_INSTALL_PACKAGES is absent from the built APK.

