AutoName: BirdEcho
Summary: Companion app for BirdNET-Pi, BirdNET-Go and BirdWeather stations
Description: |-
  BirdEcho connects to your backyard bird-detection station (BirdNET-Pi,
  BirdNET-Go or BirdWeather) and shows you live detections, species histories,
  audio playback and statistics, all from your phone.

  Features:

  * Real-time detection feed with confidence scores, auto-refreshed every 60 s
  * Per-sighting audio playback and shareable image cards
  * Species browser with detection history and per-species recent sightings
  * 14-day detection bar chart and headline stats (total, today, unique species)
  * CSV export of detections from the Stats tab
  * Offline cache: the last 24 hours of detections are readable without a network connection
  * Favorites and user-defined rare species, with local notifications (once per species per day)
  * Dark mode and station-timezone timestamps
  * Multi-station: save any number of stations and switch between them in Settings
  * Android home-screen widget showing the latest detection and today's count
  * Station locations with one-tap hand-off to your maps app
  * BirdNET-Pi and BirdNET-Go direct: connects over your LAN via HTTP, no cloud account required
  * BirdWeather: connects via the hosted BirdWeather API (free account required)

  BirdEcho is not a bird-identification app. It does not access your microphone
  or run any detection model. It surfaces what your existing station has already detected.

  The BirdWeather API token is stored in the Android Keystore. BirdNET-Pi and
  BirdNET-Go connections require no token.

  Compared with the GitHub release, this build has no in-app updater (F-Droid
  provides updates), no Sentry SDK and no Google Maps view; the Map tab shows a
  station list that opens locations in your maps app instead.

